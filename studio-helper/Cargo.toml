[package]
name = "studio-helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The native part of OpenStage Studio: window pictures, speech, and the finished video."

# The capture engine is copied from OpenStage Author's OpenScreen (see capture/IMPORT-MANIFEST.md) and used as it is.
[dependencies]
openstage-capture-windows = { path = "../capture/crates/openstage-capture-windows" }
openstage-capture-render = { path = "../capture/crates/openstage-capture-render" }
openstage-capture-project = { path = "../capture/crates/openstage-capture-project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG files for the still pictures of the take. MIT OR Apache-2.0.
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Variant",
] }
windows-future = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
