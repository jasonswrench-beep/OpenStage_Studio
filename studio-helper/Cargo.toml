[package]
name = "studio-helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The native part of OpenStage Studio: window pictures, speech, and the finished video."

# The capture engine (C1) is the OpenStage shared core's, at its published tag (openstage-core CORE-NOTES.md). A change to
# it is made in the core first and gets a new tag; Studio moves its pin only with its own checks passing.
[dependencies]
openstage-capture-windows = { git = "https://github.com/jasonswrench-beep/openstage-core", tag = "capture-v0.1.0" }
openstage-capture-render = { git = "https://github.com/jasonswrench-beep/openstage-core", tag = "capture-v0.1.0" }
openstage-capture-project = { git = "https://github.com/jasonswrench-beep/openstage-core", tag = "capture-v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG files for the still pictures of the take. MIT OR Apache-2.0.
png = "0.17"
# Kokoro narration (src/kokoro.rs). ONNX Runtime through ort, MIT OR Apache-2.0; ONNX Runtime itself is MIT.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-31"] }
# Kokoro's dictionary front end, MIT, built WITHOUT its default espeak feature (espeak-ng is GPL). Do not turn it on.
misaki-rs = { version = "0.9.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media",
    "Media_Core",
    "Media_Ocr",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
