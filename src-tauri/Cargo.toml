[package]
name = "openstage-studio"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Narrated, captioned tutorial videos from a script"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# For writing the demo-mode hook's settings into the practice program's page safely. Already part of Tauri's own dependencies.
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
